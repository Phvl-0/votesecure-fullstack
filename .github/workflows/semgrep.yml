name: Semgrep

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Semgrep (pinned)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --timeout 60 --retries 5 semgrep==1.183.0

      - name: Scan the code
        run: >
          /tmp/venv/bin/semgrep scan --metrics=off --error
          --config p/python --config p/secrets --config p/dockerfile --config p/typescript .
