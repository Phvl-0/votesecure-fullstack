services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: authdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
  api:
    build: ./backend
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://appuser:${POSTGRES_PASSWORD}@db:5432/authdb
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    ports:
      - "127.0.0.1:8089:80"
    depends_on:
      - api
volumes:
  pgdata:
